name: publish

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Exact released commit to build
        type: string
        required: true
      release_tag:
        description: Release to attach binaries to
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flacura-windows-x86_64-${{ needs.build.outputs.label }}
          path: dist
      - name: Package
        shell: pwsh
        env:
          ARCHIVE_NAME: flacura-windows-x86_64-${{ needs.build.outputs.label }}.zip
        run: |
          Compress-Archive -LiteralPath dist/flacura.exe -DestinationPath $env:ARCHIVE_NAME
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: flacura-*.zip
          fail_on_unmatched_files: true
