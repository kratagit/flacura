name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: flacura
            artifact: flacura-linux-x86_64
          - os: windows-latest
            bin: flacura.exe
            artifact: flacura-windows-x86_64
          - os: macos-latest
            bin: flacura
            artifact: flacura-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["package"]["version"]
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          package = next(p for p in lock["package"] if p["name"] == "flacura" and "source" not in p)
          if package["version"] != version:
              raise SystemExit("Cargo.toml and Cargo.lock versions must match")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}":
                  raise SystemExit(f"Release tag must be v{version}")
              label = f"v{version}"
          else:
              label = f"v{version}-dev.{os.environ['GITHUB_SHA'][:7]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"label={label}", file=output)

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked --release
      - run: cargo build --locked --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.label }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Package
        run: |
          for d in flacura-*; do
            (cd "$d" && chmod +x flacura* && zip -9 "../$d.zip" flacura*)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: flacura-*.zip
