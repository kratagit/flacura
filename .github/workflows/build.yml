name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare release version
        id: version
        shell: pwsh
        run: ./.github/scripts/prepare-release.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked --release
      - run: cargo build --locked --release

      - name: Name executable
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: Copy-Item -LiteralPath target/release/flacura.exe -Destination "target/release/flacura-v${env:APP_VERSION}-windows-x86_64.exe"

      - name: Publish executable
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Flacura v${{ steps.version.outputs.version }} — Windows x86_64
          target_commitish: ${{ github.sha }}
          files: target/release/flacura-v${{ steps.version.outputs.version }}-windows-x86_64.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
